name: ink_study
description: Ghi chú viết tay và chỉnh vùng PDF ngoại tuyến trên Windows.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  pdfrx: 2.4.8
  super_clipboard: ^0.9.1
  window_manager: ^0.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
