<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>VietInk - Bản thử viết tay</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#eef1f7;color:#28314c}#app{display:flex;height:100dvh;flex-direction:column}header,nav{display:flex;gap:8px;align-items:center;padding:9px 12px;background:#fff;overflow-x:auto;flex-shrink:0}header{border-bottom:1px solid #dbe1ed}strong{color:#3e4eb5;font-size:19px}input,button,select{font:inherit}#title{min-width:110px;width:220px;max-width:33vw;border:1px solid #dce1ed;border-radius:8px;padding:8px}button,select{background:white;border:1px solid #d6ddec;color:#364269;border-radius:9px;padding:8px 11px;white-space:nowrap}button.on{background:#e6eaff;color:#263e9c;border-color:#5369cd;font-weight:700}input[type=color]{width:36px;height:35px;border:none;background:transparent}label{display:flex;align-items:center;gap:5px;white-space:nowrap}nav{background:#f9faff}aside{font-size:11px;background:#fff3ce;color:#67501e;padding:6px 12px}main{flex:1;min-height:0;position:relative;touch-action:none;overflow:hidden}canvas{width:100%;height:100%;touch-action:none;display:block}.tip{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#fffd;padding:8px 12px;border-radius:20px;font-size:11px;pointer-events:none;white-space:nowrap}@media(max-width:700px){header{padding:6px}nav{order:3}header strong{font-size:16px}header button{padding:7px}aside{font-size:10px}.tip{font-size:9px}}
</style></head><body><div id="app">
<header><strong>✒ VietInk</strong><input id="title" value="Ghi chú mới" aria-label="Tên ghi chú"><span style="flex:1"></span><button id="undo">↶</button><button id="redo">↷</button><button id="export">Xuất PNG</button></header>
<nav><button class="on" data-mode="pen">✎ Bút</button><button data-mode="marker">🖍 Dạ quang</button><button data-mode="eraser">⌫ Tẩy nét</button><button data-mode="line">／ Thẳng</button><button data-mode="rect">▭ Chữ nhật</button><button data-mode="laser">◉ Laser</button><button data-mode="pan">✋ Di chuyển</button><label>Màu<input id="color" type="color" value="#3045a5"></label><label>Nét<input id="width" type="range" min="1" max="20" value="3"></label><label>Giấy<select id="paper"><option value="grid">Ô ly</option><option value="lines">Kẻ ngang</option><option value="dots">Chấm</option><option value="blank">Trắng</option></select></label><button id="zin">＋</button><button id="zout">－</button><button id="new">Ghi chú mới</button></nav>
<aside>Bản thử độc lập trên web; không phải Flutter đầy đủ. Lưu trên trình duyệt này; chưa có nền PDF và đồng bộ.</aside>
<main id="stage"><canvas id="canvas"></canvas><div class="tip">Viết bằng bút/chuột · Hai ngón di chuyển/thu phóng · Ctrl + cuộn chuột để phóng</div></main>
</div><script>
'use strict';const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d'),stage=$('stage'),key='vietink-trial-2026-v1';let mode='pen',doc={title:'Ghi chú mới',paper:'grid',height:3200,marks:[]},cam={x:0,y:15,z:1},hist=[],redo=[],current=null,laser=null,pointers=new Map(),pinch=null,vw=1,vh=1,dpr=1,saver;
const clone=v=>JSON.parse(JSON.stringify(v)),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function save(){clearTimeout(saver);saver=setTimeout(()=>{try{doc.title=$('title').value;localStorage.setItem(key,JSON.stringify({doc,cam}))}catch(e){alert('Không đủ dung lượng để lưu ghi chú.')}},180)}
function sync(){ $('title').value=doc.title;$('paper').value=doc.paper;draw();save()}
function checkpoint(){hist.push(clone(doc));if(hist.length>40)hist.shift();redo=[]}
function undo(){if(!hist.length)return;redo.push(clone(doc));doc=hist.pop();sync()}function redoStep(){if(!redo.length)return;hist.push(clone(doc));doc=redo.pop();sync()}
function resize(){const r=stage.getBoundingClientRect();vw=r.width;vh=r.height;dpr=Math.min(2,devicePixelRatio||1);c.width=Math.round(vw*dpr);c.height=Math.round(vh*dpr);draw()}
function pt(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function world(p){return{x:(p.x-cam.x)/cam.z,y:(p.y-cam.y)/cam.z}}
function ink(s){if(!s.pts.length)return;ctx.save();ctx.lineWidth=s.w*(s.type==='marker'?3:1);ctx.strokeStyle=s.type==='laser'?'#ee3858':s.color;ctx.globalAlpha=s.type==='marker'?.3:1;ctx.lineJoin='round';ctx.lineCap='round';const a=s.pts[0],b=s.pts[s.pts.length-1];ctx.beginPath();ctx.moveTo(a.x,a.y);if(s.type==='rect')ctx.rect(a.x,a.y,b.x-a.x,b.y-a.y);else if(s.type==='line')ctx.lineTo(b.x,b.y);else if(s.pts.length===1)ctx.lineTo(a.x+.1,a.y+.1);else s.pts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();ctx.restore()}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,vw,vh);ctx.fillStyle='#e8edf5';ctx.fillRect(0,0,vw,vh);ctx.save();ctx.translate(cam.x,cam.y);ctx.scale(cam.z,cam.z);ctx.fillStyle='#fffdfa';ctx.fillRect(0,0,900,doc.height);ctx.save();ctx.beginPath();ctx.rect(0,0,900,doc.height);ctx.clip();ctx.strokeStyle='#d9e3f1';ctx.fillStyle='#d9e3f1';ctx.lineWidth=0.8;let low=Math.max(0,Math.floor(-cam.y/cam.z/28)*28-28),high=Math.min(doc.height,(vh-cam.y)/cam.z+56);
if(doc.paper==='grid')for(let x=0;x<=900;x+=28){ctx.beginPath();ctx.moveTo(x,low);ctx.lineTo(x,high);ctx.stroke()}
if(doc.paper==='grid'||doc.paper==='lines')for(let y=low;y<=high;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}
if(doc.paper==='dots')for(let y=low;y<=high;y+=28)for(let x=0;x<=900;x+=28){ctx.beginPath();ctx.arc(x,y,1.2,0,7);ctx.fill()}
doc.marks.forEach(ink);if(current?.kind==='draw')ink(current.mark);
if(laser){let a=laser.stopped?Math.max(0,1-(performance.now()-laser.stopped)/1500):1;if(a>0){ctx.save();ctx.globalAlpha=a;ink(laser.mark);ctx.restore();if(laser.stopped)requestAnimationFrame(draw)}else laser=null}ctx.restore();ctx.strokeStyle='#ccd5e5';ctx.strokeRect(0,0,900,doc.height);ctx.restore()}
function dist(p,a,b){let dx=b.x-a.x,dy=b.y-a.y,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(p.x-a.x-dx*t,p.y-a.y-dy*t)}
function near(m,p){const q=m.pts;return q.some(v=>Math.hypot(v.x-p.x,v.y-p.y)<14/cam.z)||q.slice(1).some((v,i)=>dist(p,q[i],v)<14/cam.z+m.w/2)}
function erase(p){doc.marks=doc.marks.filter(m=>!near(m,p));draw()}
function extend(){if((vh-cam.y)/cam.z>doc.height-300){doc.height+=1000;save()}}
function down(e){if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();c.setPointerCapture(e.pointerId);const p=pt(e);pointers.set(e.pointerId,p);if(pointers.size>=2){current=null;pinch=null;return}if(mode==='pan'){current={kind:'pan',p,cam:{...cam}};return}const w=world(p);if(mode==='eraser'){checkpoint();current={kind:'erase'};erase(w);return}const mark={type:mode,color:$('color').value,w:+$('width').value,pts:[w]};if(mode==='laser'){laser={mark,stopped:0};current={kind:'laser'}}else{checkpoint();current={kind:'draw',mark}}draw()}
function move(e){if(!pointers.has(e.pointerId))return;const p=pt(e);pointers.set(e.pointerId,p);
if(pointers.size===2){let a=[...pointers.values()],m={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(!pinch)pinch={m,d,cam:{...cam}};let w={x:(pinch.m.x-pinch.cam.x)/pinch.cam.z,y:(pinch.m.y-pinch.cam.y)/pinch.cam.z};cam.z=clamp(pinch.cam.z*d/Math.max(1,pinch.d),.22,3);cam.x=m.x-w.x*cam.z;cam.y=m.y-w.y*cam.z;extend();draw();return}
if(!current)return;const w=world(p);if(current.kind==='pan'){cam.x=current.cam.x+p.x-current.p.x;cam.y=current.cam.y+p.y-current.p.y}
if(current.kind==='draw'){if(['line','rect'].includes(mode))current.mark.pts=[current.mark.pts[0],w];else current.mark.pts.push(w)}
if(current.kind==='laser')laser?.mark.pts.push(w);if(current.kind==='erase')erase(w);extend();draw()}
function up(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;if(current?.kind==='draw')doc.marks.push(current.mark);if(laser&&!laser.stopped){laser.stopped=performance.now();requestAnimationFrame(draw)}current=null;save();draw()}
c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey){let p=pt(e),w=world(p);cam.z=clamp(cam.z*(e.deltaY>0?.9:1.1),.22,3);cam.x=p.x-w.x*cam.z;cam.y=p.y-w.y*cam.z}else{cam.y-=e.deltaY;cam.x-=e.deltaX}extend();save();draw()},{passive:false});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b))});
$('paper').onchange=()=>{checkpoint();doc.paper=$('paper').value;draw();save()};$('title').onchange=save;$('undo').onclick=undo;$('redo').onclick=redoStep;
$('new').onclick=()=>{if(confirm('Tạo ghi chú mới và thay thế bản đang mở?')){checkpoint();doc={title:'Ghi chú mới',paper:'grid',height:3200,marks:[]};sync()}};
function zoom(f){let p={x:vw/2,y:vh/2},w=world(p);cam.z=clamp(cam.z*f,.22,3);cam.x=p.x-w.x*cam.z;cam.y=p.y-w.y*cam.z;draw();save()}
$('zin').onclick=()=>zoom(1.2);$('zout').onclick=()=>zoom(1/1.2);
$('export').onclick=()=>{draw();const a=document.createElement('a');a.download=($('title').value||'VietInk')+'.png';a.href=c.toDataURL('image/png');a.click()};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redoStep():undo()}});
try{let v=JSON.parse(localStorage.getItem(key));if(v?.doc){doc=v.doc;cam=v.cam||cam;$('title').value=doc.title;$('paper').value=doc.paper}}catch(e){}window.addEventListener('resize',resize);resize();if(!localStorage.getItem(key)){cam.z=Math.min(1,(vw-30)/900);cam.x=(vw-900*cam.z)/2;draw()}
</script></body></html>
