name: Build Ink Study for Windows

on:
  push:
    paths:
      - "ink-study/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ink-study-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"

      - name: Set up Inno Setup
        shell: pwsh
        run: |
          $knownCompilers = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7/ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 7/ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe')
          )
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not ($knownCompilers | Where-Object { Test-Path -LiteralPath $_ })) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build and verify the installer
        shell: pwsh
        working-directory: ink-study
        run: ./scripts/build-windows.ps1 -VerifyInstall

      - name: Upload InkStudy-Setup.exe
        id: installer
        uses: actions/upload-artifact@v7
        with:
          path: ink-study/dist/InkStudy-Setup.exe
          archive: false
          if-no-files-found: error

      - name: Link the Windows download
        shell: pwsh
        env:
          INSTALLER_URL: ${{ steps.installer.outputs.artifact-url }}
        run: |
          $hash = (Get-FileHash -LiteralPath 'ink-study/dist/InkStudy-Setup.exe').Hash
          "[Tải InkStudy-Setup.exe]($env:INSTALLER_URL)" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
